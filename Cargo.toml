[package]
name = "cinder-rxt-worker"
version = "0.1.0"
edition = "2021"
authors = ["Dan With <dan.with@rackspace.com>", "Rackspace US, Inc."]
description = "High-performance parallel Swift chunk downloader and differential snapshot engine for Cinder RXT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
hex = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
